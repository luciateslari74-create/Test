<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Классная доска — темы контрольных</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<style>
  :root{
    --board:#1f3d2f;
    --chalk:#f4f1e8;
    --chalk-dim:#b9c4b3;
    --accent:#ff8a5c;
    --card:#274a37;
    --card-border:#3a624a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--board);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.04) 0, transparent 40%),
      radial-gradient(circle at 85% 75%, rgba(255,255,255,0.04) 0, transparent 40%);
    color: var(--chalk);
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    min-height:100vh;
    padding: 40px 20px 140px;
  }
  header{ text-align:center; margin-bottom: 26px; animation: dropIn .6s ease; }
  @keyframes dropIn{ from{transform:translateY(-24px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  h1{ font-family:'Comic Sans MS','Trebuchet MS',cursive,sans-serif; font-size:2.2rem; text-shadow:2px 2px 0 rgba(0,0,0,.25); }
  h1 span{ color: var(--accent); }
  p.subtitle{ color: var(--chalk-dim); margin-top:6px; font-size:.95rem; }
  p.counter{ color: var(--accent); font-size:.85rem; margin-top:10px; font-weight:bold; }
  p.admin-greeting{ color: var(--chalk-dim); font-size:.85rem; margin-top:8px; font-style:italic; }
  .share-btn{
    margin-top:14px; background:var(--card); color:var(--chalk); border:1px solid var(--card-border);
    padding:9px 18px; border-radius:20px; cursor:pointer; font-size:.85rem; transition: transform .15s ease, background .15s ease;
  }
  .share-btn:hover{ background:var(--accent); color:#2a1a10; transform: scale(1.04); }
  .admin-btn{ margin-left:8px; }
  .storage-banner{
    max-width:480px; margin:12px auto 0; padding:10px 14px; border-radius:12px;
    background:#3a2a1a; border:1px solid #c0453a; color:#e08c82; font-size:.8rem; text-align:center;
  }
  .storage-banner.ok{ background:#1a3a2a; border-color:#3a624a; color:var(--chalk-dim); }

  .searchbar{
    max-width:480px; margin:24px auto; display:flex; gap:8px;
    background: var(--card); border-radius:30px; padding:6px 6px 6px 18px;
    box-shadow:0 6px 14px rgba(0,0,0,.25); animation: dropIn .8s ease;
  }
  .searchbar input{ flex:1; background:transparent; border:none; outline:none; color:var(--chalk); font-size:1rem; padding:10px 0; }
  .searchbar input::placeholder{ color:var(--chalk-dim); }

  .filters{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:28px; }
  .filters select{
    background:var(--card); color:var(--chalk); border:1px solid var(--card-border);
    border-radius:20px; padding:8px 14px; font-size:.85rem; outline:none;
  }

  .grid{
    max-width:1000px; margin:0 auto; display:grid;
    grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap:20px;
  }
  .card{
    background:var(--card); border:1px solid var(--card-border); border-radius:12px;
    padding:16px; box-shadow:0 8px 18px rgba(0,0,0,.28);
    animation: cardIn .35s ease; cursor:pointer; transition: transform .15s ease, border-color .15s ease;
  }
  .card:hover{ transform: translateY(-3px); border-color: var(--accent); }
  @keyframes cardIn{ from{opacity:0; transform:translateY(10px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }
  .click-hint{ color: var(--accent) !important; font-size:.72rem !important; margin-top:8px; font-weight:bold; }
  .tag{ display:inline-block; background:var(--accent); color:#2a1a10; font-weight:bold; font-size:.72rem; padding:3px 10px; border-radius:12px; margin-bottom:8px; }
  .card h3{ font-size:1.05rem; margin-bottom:4px; }
  .card p{ color:var(--chalk-dim); font-size:.85rem; }
  .empty{ text-align:center; color:var(--chalk-dim); margin-top:60px; grid-column:1/-1; }

  .card-actions{ display:flex; gap:8px; margin-top:10px; }
  .like-btn, .delete-btn{
    border:1px solid var(--card-border); background:transparent; color:var(--chalk);
    border-radius:16px; padding:5px 12px; font-size:.78rem; cursor:pointer;
    transition: transform .15s ease, background .15s ease;
  }
  .like-btn:hover{ background:var(--accent); color:#2a1a10; border-color:var(--accent); }
  .like-btn.liked{ background:#c0453a; border-color:#c0453a; color:#fff; animation: heartPop .35s ease; }
  @keyframes heartPop{ 0%{transform:scale(1);} 40%{transform:scale(1.25);} 100%{transform:scale(1);} }
  .delete-btn{ border-color:#c0453a; color:#e08c82; }
  .delete-btn:hover{ background:#c0453a; color:white; }

  .fab{
    position:fixed; left:24px; bottom:24px; width:58px; height:58px; border-radius:50%;
    background:var(--accent); color:#2a1a10; font-size:1.8rem; border:none; cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,.4); transition: transform .2s ease;
    display:flex; align-items:center; justify-content:center;
  }
  .fab:hover{ transform: scale(1.08) rotate(90deg); }

  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
    align-items:center; justify-content:center; padding:20px; z-index:10;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:var(--card); border-radius:16px; padding:24px; width:100%; max-width:380px;
    animation: modalIn .25s ease; box-shadow:0 20px 40px rgba(0,0,0,.4);
  }
  @keyframes modalIn{ from{opacity:0; transform:translateY(20px) scale(.95);} to{opacity:1; transform:translateY(0) scale(1);} }
  .modal h2{ margin-bottom:16px; font-size:1.2rem; }
  .modal label{ display:block; font-size:.8rem; color:var(--chalk-dim); margin:10px 0 4px; }
  .modal input, .modal select{
    width:100%; padding:10px; border-radius:8px; border:1px solid var(--card-border);
    background:#1f3d2f; color:var(--chalk); outline:none; font-size:.9rem;
  }
  .modal-buttons{ display:flex; gap:10px; margin-top:18px; }
  .modal-buttons button{ flex:1; padding:10px; border:none; border-radius:8px; cursor:pointer; font-weight:bold; }
  .btn-cancel{ background:transparent; border:1px solid var(--card-border) !important; color:var(--chalk); }
  .btn-publish{ background:var(--accent); color:#2a1a10; }
  .status{ text-align:center; font-size:.8rem; color:var(--chalk-dim); margin-top:10px; min-height:16px; }

  .tutor-modal{ max-width:420px; display:flex; flex-direction:column; max-height:80vh; }
  .tutor-chat{
    flex:1; overflow-y:auto; margin:12px 0; display:flex; flex-direction:column; gap:8px;
    max-height:340px; min-height:120px;
  }
  .tutor-msg{
    padding:9px 13px; border-radius:12px; font-size:.88rem; max-width:85%; line-height:1.4;
    white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
  }
  .tutor-msg.user{ background:var(--accent); color:#2a1a10; align-self:flex-end; }
  .tutor-msg.ai{ background:#1f3d2f; color:var(--chalk); align-self:flex-start; }
  .tutor-input-row{ display:flex; gap:8px; }
  .tutor-input-row input{
    flex:1; padding:10px; border-radius:8px; border:1px solid var(--card-border);
    background:#1f3d2f; color:var(--chalk); outline:none; font-size:.9rem;
  }
  .tutor-input-row button{
    background:var(--accent); color:#2a1a10; border:none; border-radius:8px; padding:0 16px; cursor:pointer; font-weight:bold;
  }
  .tutor-close{ margin-top:10px; }

  @media (max-width: 480px){
    body{ padding: 24px 14px 110px; }
    h1{ font-size:1.7rem; }
    .fab{ width:52px; height:52px; font-size:1.5rem; left:16px; bottom:16px; }
    .modal{ padding:18px; }
    .grid{ gap:14px; }
  }
  @media (min-width: 481px) and (max-width: 900px){
    .grid{ grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); }
  }
  @media (min-width: 1200px){
    body{ padding-left: 60px; padding-right: 60px; }
    .grid{ max-width: 1100px; }
  }
</style>
</head>
<body>

<header>
  <h1>Классная <span>доска</span></h1>
  <p class="subtitle">Темы прошедших контрольных — для подготовки к похожим темам в будущем</p>
  <p class="admin-greeting" id="adminGreeting"></p>
  <p class="counter" id="counter"></p>
  <div class="storage-banner" id="storageBanner" style="display:none;"></div>
  <button class="share-btn" onclick="shareSite()">🔗 Поделиться сайтом</button>
  <button class="share-btn admin-btn" onclick="openAdminLogin()">🔒 Админ</button>
</header>

<div class="searchbar">
  <input id="searchInput" placeholder="Поиск по теме, предмету, классу...">
</div>

<div class="filters">
  <select id="filterClass"><option value="">Все классы</option></select>
  <select id="filterSubject"><option value="">Все предметы</option></select>
</div>

<div class="grid" id="grid">
  <div class="empty">Загрузка...</div>
</div>

<div class="overlay" id="tutorOverlay">
  <div class="modal tutor-modal">
    <h2 id="tutorTitle">Помощник по теме</h2>
    <div class="tutor-chat" id="tutorChat"></div>
    <div class="tutor-input-row">
      <input id="tutorInput" placeholder="Спроси что-нибудь по теме..." onkeydown="if(event.key==='Enter') sendTutorMessage()">
      <button onclick="sendTutorMessage()">➤</button>
    </div>
    <button class="btn-cancel tutor-close" onclick="closeTutor()">Закрыть</button>
  </div>
</div>

<div class="overlay" id="adminOverlay">
  <div class="modal">
    <h2>Вход администратора</h2>
    <label>Пароль</label>
    <input type="password" id="adminPassword" placeholder="Введи пароль">
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeAdminLogin()">Отмена</button>
      <button class="btn-publish" onclick="checkAdminPassword()">Войти</button>
    </div>
    <div class="status" id="adminStatus"></div>
  </div>
</div>

<button class="fab" onclick="openModal()">+</button>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Добавить запись</h2>
    <label>Класс</label>
    <input id="inputClass" placeholder="например, 9">
    <label>Предмет</label>
    <input id="inputSubject" placeholder="например, история">
    <label>Тема контрольной</label>
    <input id="inputTopic" placeholder="например, Пушкин">
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="btn-publish" onclick="publishEntry()">Опубликовать</button>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
const GEMINI_API_KEY = 'AQ.Ab8RN6IYBbFtVyYmZ_iy49FmEo-1MauJwEwn9dXQmqoWnkZ4xA';
const GEMINI_MODEL = 'gemini-flash-latest';

const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  databaseURL: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};

function isAiAvailable() {
  return GEMINI_API_KEY && GEMINI_API_KEY.trim().length > 10;
}
function isFirebaseConfigured() {
  return FIREBASE_CONFIG.databaseURL && FIREBASE_CONFIG.databaseURL.length > 10 && FIREBASE_CONFIG.apiKey;
}

let db = null;
let firebaseReady = false;

function initFirebase() {
  if (!isFirebaseConfigured()) return false;
  try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    firebaseReady = true;
    return true;
  } catch (e) {
    console.error('Firebase init error', e);
    return false;
  }
}

const storage = {
  async get(key) {
    if (firebaseReady && db) {
      try {
        const snap = await db.ref(key).once('value');
        const val = snap.val();
        if (val != null) return typeof val === 'string' ? val : JSON.stringify(val);
      } catch (e) { console.error(e); }
    }
    try { return localStorage.getItem('classboard_' + key); } catch (e) { return null; }
  },
  async set(key, value) {
    let ok = false;
    if (firebaseReady && db) {
      try { await db.ref(key).set(JSON.parse(value)); ok = true; }
      catch (e) { console.error('Firebase set error', e); }
    }
    try { localStorage.setItem('classboard_' + key, value); ok = true; } catch (e) {}
    return ok;
  },
  listen(key, callback) {
    if (firebaseReady && db) {
      db.ref(key).on('value', (snap) => {
        const val = snap.val();
        callback(val != null ? (typeof val === 'string' ? val : JSON.stringify(val)) : '[]');
      });
      return true;
    }
    return false;
  }
};

let entries = [];

function updateStorageBanner() {
  const el = document.getElementById('storageBanner');
  if (!el) return;
  if (firebaseReady) {
    el.style.display = 'block';
    el.className = 'storage-banner ok';
    el.textContent = '☁️ Облако подключено — записи видят все';
  } else {
    el.style.display = 'block';
    el.className = 'storage-banner';
    el.textContent = '📱 Пока только на этом устройстве. Настрой Firebase, чтобы видели все.';
  }
}

async function loadEntries(){
  try{
    const raw = await storage.get('entries');
    entries = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(entries)) entries = [];
  }catch(e){ entries = []; }
  renderFilters();
  renderGrid();
  updateCounter();
}

function updateCounter(){
  const el = document.getElementById('counter');
  if(!el) return;
  el.textContent = entries.length > 0 ? `📌 Уже добавлено записей: ${entries.length}` : '';
}

function showAdminGreeting(){
  const greetings = [
    'Желаю вам здоровья от админа 💚',
    'Спасибо, что зашли на сайт — хорошего дня!',
    'Админ желает удачи на учёбе 🍀',
    'Заходите почаще — сайт растёт вместе с вами!',
    'Хорошего настроения от админа этого сайта 🙌',
    'Пусть подготовка идёт легко — админ верит в вас!'
  ];
  const el = document.getElementById('adminGreeting');
  if(el) el.textContent = greetings[Math.floor(Math.random() * greetings.length)];
}

function shareSite(){
  const url = window.location.href;
  if(navigator.share){
    navigator.share({ title: 'Классная доска', text: 'Темы прошедших контрольных для подготовки', url });
  } else {
    navigator.clipboard.writeText(url).then(() => {
      alert('Ссылка скопирована! Кидай в чат класса 🚀');
    }).catch(() => { prompt('Скопируй ссылку вручную:', url); });
  }
}

let currentTutorEntry = null;
let tutorHistory = [];

function openTutorById(id){
  const entry = entries.find(e => e.id === id);
  if(entry) openTutor(entry);
}

function openTutor(entry){
  currentTutorEntry = entry;
  tutorHistory = [];
  document.getElementById('tutorTitle').textContent = `${entry.subject} — ${entry.topic}`;
  document.getElementById('tutorChat').innerHTML = '';
  if (isAiAvailable()) {
    addTutorMessage('ai', `Привет! Я помогу разобраться с темой «${entry.topic}» по предмету «${entry.subject}». Можешь спросить объяснение, попросить похожий пример для тренировки или задать вопрос по теме.`);
  } else {
    addTutorMessage('ai', `ИИ-помощник сейчас выключен.\n\nТема: «${entry.topic}»\nПредмет: ${entry.subject}\nКласс: ${entry.cls}`);
  }
  document.getElementById('tutorOverlay').classList.add('show');
}

function closeTutor(){
  document.getElementById('tutorOverlay').classList.remove('show');
  currentTutorEntry = null;
}

function addTutorMessage(role, text){
  const chat = document.getElementById('tutorChat');
  const div = document.createElement('div');
  div.className = 'tutor-msg ' + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function callGemini({ system, contents, maxTokens = 800 }) {
  if (!isAiAvailable()) throw new Error('NO_API_KEY');
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
  const body = { contents, generationConfig: { maxOutputTokens: maxTokens, temperature: 0.6 } };
  if (system) body.systemInstruction = { parts: [{ text: system }] };
  const response = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-goog-api-key': GEMINI_API_KEY },
    body: JSON.stringify(body)
  });
  if (!response.ok) {
    const errText = await response.text();
    throw new Error(`Gemini API error ${response.status}: ${errText}`);
  }
  const data = await response.json();
  return (data?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '').trim();
}

async function sendTutorMessage(){
  const input = document.getElementById('tutorInput');
  const text = input.value.trim();
  if(!text || !currentTutorEntry) return;

  if (!isAiAvailable()) {
    addTutorMessage('user', text);
    addTutorMessage('ai', 'ИИ-помощник сейчас выключен.');
    input.value = '';
    return;
  }

  input.value = '';
  addTutorMessage('user', text);
  tutorHistory.push({ role: 'user', parts: [{ text }] });
  addTutorMessage('ai', '...');
  const chat = document.getElementById('tutorChat');

  try{
    const systemPrompt = `Ты — дружелюбный школьный ИИ-помощник по теме "${currentTutorEntry.topic}" (предмет: ${currentTutorEntry.subject}, класс: ${currentTutorEntry.cls}).
Объясняй тему простыми словами, приводи СВОИ ПРИМЕРЫ для тренировки (не из реальной контрольной — у тебя и нет к ней доступа, только название темы).
НИКОГДА не выдавай готовые ответы на задания какой-либо конкретной контрольной работы.
Математику пиши обычным текстом без LaTeX: 3 × 4 = 12, 12 ÷ 4 = 3, x^2 + 5x - 6.
Отвечай коротко и понятно для школьника.`;

    const reply = await callGemini({ system: systemPrompt, contents: tutorHistory, maxTokens: 500 })
      || 'Извини, не получилось ответить.';

    chat.lastChild.remove();
    addTutorMessage('ai', reply);
    tutorHistory.push({ role: 'model', parts: [{ text: reply }] });
  }catch(e){
    chat.lastChild.remove();
    addTutorMessage('ai', 'Ошибка: ' + (e?.message || 'неизвестная') );
  }
}

const ADMIN_PASSWORD = '123rotor321';
let isAdmin = false;

function openAdminLogin(){
  if(isAdmin){
    alert('Ты уже вошёл как админ. Нажми «Удалить» на карточке.');
    return;
  }
  document.getElementById('adminOverlay').classList.add('show');
}
function closeAdminLogin(){
  document.getElementById('adminOverlay').classList.remove('show');
  document.getElementById('adminPassword').value = '';
  document.getElementById('adminStatus').textContent = '';
}
function checkAdminPassword(){
  const val = document.getElementById('adminPassword').value;
  if(val === ADMIN_PASSWORD){
    isAdmin = true;
    closeAdminLogin();
    renderGrid();
    alert('Вход выполнен! Теперь на карточках есть кнопка удаления.');
  } else {
    document.getElementById('adminStatus').textContent = 'Неверный пароль';
  }
}

async function deleteEntry(id, event){
  event.stopPropagation();
  if(!confirm('Удалить эту запись?')) return;
  entries = entries.filter(e => e.id !== id);
  try{ await storage.set('entries', JSON.stringify(entries)); }catch(e){}
  renderFilters();
  renderGrid();
  updateCounter();
}

let likeInProgress = new Set();

function getMyLikes(){
  try{ return new Set(JSON.parse(localStorage.getItem('classboard_my_likes') || '[]')); }
  catch(e){ return new Set(); }
}
function saveMyLikes(set){
  try{ localStorage.setItem('classboard_my_likes', JSON.stringify([...set])); }catch(e){}
}

async function likeEntry(id, event){
  event.stopPropagation();
  if(likeInProgress.has(id)) return;
  likeInProgress.add(id);
  try{
    let fresh = entries;
    try{ const raw = await storage.get('entries'); if(raw) fresh = JSON.parse(raw); }catch(e){}
    const entry = fresh.find(e => e.id === id);
    if(!entry){ likeInProgress.delete(id); return; }

    const myLikes = getMyLikes();
    if(myLikes.has(id)){
      entry.likes = Math.max(0, Number(entry.likes || 0) - 1);
      myLikes.delete(id);
    } else {
      entry.likes = Number(entry.likes || 0) + 1;
      myLikes.add(id);
    }
    saveMyLikes(myLikes);
    entries = fresh;
    renderGrid();
    await storage.set('entries', JSON.stringify(entries));
  }catch(e){
    await loadEntries();
  }finally{
    likeInProgress.delete(id);
  }
}

function openModal(){ document.getElementById('overlay').classList.add('show'); }
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('inputClass').value = '';
  document.getElementById('inputSubject').value = '';
  document.getElementById('inputTopic').value = '';
  document.getElementById('status').textContent = '';
}

function checkContent(text){
  const lower = text.toLowerCase();
  const banned = ['бляд','сука','хуй','пизд','ебат','ебан','мудак','гандон','пидор'];
  for(const word of banned){
    if(lower.includes(word)) return { ok:false, reason:'В тексте похоже на нецензурную лексику — перепиши, пожалуйста' };
  }
  if(/(.)\1{5,}/.test(lower)) return { ok:false, reason:'Похоже на спам — попробуй написать нормально' };
  return { ok:true };
}

async function getAiHelp(subject, topic){
  const prompt = `Тема контрольной: предмет "${subject}", тема "${topic}".
Напиши ТОЛЬКО валидный JSON без markdown, без \`\`\`:
{"description": "1-2 предложения простыми словами", "difficulty": "лёгкая/средняя/сложная", "prepTips": ["совет 1", "совет 2", "совет 3"]}
НЕ пиши готовые ответы на задания контрольной, только общие направления подготовки.`;
  const text = await callGemini({ contents: [{ role:'user', parts:[{ text: prompt }] }], maxTokens: 600 });
  const clean = text.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

async function publishEntry(){
  const cls = document.getElementById('inputClass').value.trim();
  const subject = document.getElementById('inputSubject').value.trim();
  const topic = document.getElementById('inputTopic').value.trim();
  const statusEl = document.getElementById('status');

  if(!cls || !subject || !topic){
    statusEl.textContent = 'Заполни все поля';
    return;
  }

  const modCheck = checkContent(`${cls} ${subject} ${topic}`);
  if(!modCheck.ok){
    statusEl.textContent = modCheck.reason;
    return;
  }

  let aiInfo = null;
  if (isAiAvailable()) {
    statusEl.textContent = 'ИИ оформляет запись...';
    try{ aiInfo = await getAiHelp(subject, topic); }catch(e){ aiInfo = null; }
  } else {
    statusEl.textContent = 'Публикую...';
  }

  const newEntry = {
    id: Date.now(), cls, subject, topic,
    description: aiInfo?.description || '',
    difficulty: aiInfo?.difficulty || '',
    prepTips: aiInfo?.prepTips || [],
    likes: 0
  };
  entries.unshift(newEntry);

  statusEl.textContent = 'Публикация...';
  try {
    await storage.set('entries', JSON.stringify(entries));
    renderFilters();
    renderGrid();
    updateCounter();
    closeModal();
  } catch (e) {
    statusEl.textContent = 'Сохранено локально.';
    renderFilters();
    renderGrid();
    updateCounter();
    setTimeout(closeModal, 1200);
  }
}

function renderFilters(){
  const classes = [...new Set(entries.map(e => e.cls))].sort();
  const subjects = [...new Set(entries.map(e => e.subject))].sort();
  const fc = document.getElementById('filterClass');
  const fs = document.getElementById('filterSubject');
  const curC = fc.value, curS = fs.value;
  fc.innerHTML = '<option value="">Все классы</option>' + classes.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  fs.innerHTML = '<option value="">Все предметы</option>' + subjects.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
  fc.value = curC; fs.value = curS;
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const fClass = document.getElementById('filterClass').value;
  const fSubject = document.getElementById('filterSubject').value;

  const filtered = entries.filter(e => {
    const matchQ = !q || e.topic.toLowerCase().includes(q) || e.subject.toLowerCase().includes(q) || e.cls.toLowerCase().includes(q);
    const matchC = !fClass || e.cls === fClass;
    const matchS = !fSubject || e.subject === fSubject;
    return matchQ && matchC && matchS;
  });

  if(filtered.length === 0){
    grid.innerHTML = '<div class="empty">Пока пусто. Нажми "+", чтобы добавить первую запись.</div>';
    return;
  }

  const myLikes = getMyLikes();
  grid.innerHTML = filtered.map(e => {
    const liked = myLikes.has(e.id);
    return `
    <div class="card" onclick="openTutorById(${e.id})">
      <span class="tag">${escapeHtml(e.cls)} класс</span>
      <h3>${escapeHtml(e.subject)}</h3>
      <p>Тема: ${escapeHtml(e.topic)}</p>
      <p class="click-hint">${isAiAvailable() ? 'Нажми, чтобы спросить у ИИ-помощника →' : 'Нажми, чтобы открыть тему'}</p>
      <div class="card-actions">
        <button class="like-btn ${liked ? 'liked' : ''}" onclick="likeEntry(${e.id}, event)">${liked ? '❤️' : '🤍'} ${Number(e.likes) || 0}</button>
        ${isAdmin ? `<button class="delete-btn" onclick="deleteEntry(${e.id}, event)">🗑 Удалить</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('searchInput').addEventListener('input', renderGrid);
document.getElementById('filterClass').addEventListener('change', renderGrid);
document.getElementById('filterSubject').addEventListener('change', renderGrid);
document.getElementById('overlay').addEventListener('click', (e) => { if(e.target.id === 'overlay') closeModal(); });

initFirebase();
updateStorageBanner();
if (firebaseReady) {
  storage.listen('entries', (raw) => {
    try {
      entries = JSON.parse(raw);
      if (!Array.isArray(entries)) entries = [];
      renderFilters();
      renderGrid();
      updateCounter();
    } catch(e) {}
  });
} else {
  loadEntries();
}
showAdminGreeting();
</script>
</body>
</html>
